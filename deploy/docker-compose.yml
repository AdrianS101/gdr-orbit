# Servidor: GDR Digital + Caddy (https automático).
# Uso: DOMAIN=<ip-com-tracos>.sslip.io docker compose up -d --build
services:
  orbit:
    build: ..
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN}
      TZ: America/Sao_Paulo
    volumes:
      - orbit-data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [orbit]
volumes:
  orbit-data:
  caddy-data:
